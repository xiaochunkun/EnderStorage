name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] 简要描述功能"
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请尽量描述清楚你的需求场景与期望的行为，便于评估与实现。

  - type: textarea
    id: problem
    attributes:
      label: 背景与问题
      description: 该功能要解决什么问题？为何重要？

  - type: textarea
    id: proposal
    attributes:
      label: 方案描述（必填）
      description: 功能如何工作？是否涉及 UI、配置、交互变更？可给出命令/配置/流程示例
      placeholder: 示例：新增配置项 xxx；在界面增加按钮 yyy；命令 `/es ...`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 变更范围（可多选）
      options:
        - label: 需要数据生成更新（`./gradlew runData`）
        - label: 需要资源/模型/语言文件改动
        - label: 涉及 CodeChickenLib 交互
        - label: 需要 JEI 兼容

  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息

